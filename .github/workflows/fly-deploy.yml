name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forest_bush_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./api
        run: npx prisma generate

      - name: Run API integration tests
        working-directory: ./api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forest_bush_test?schema=public
        run: npm test

      - name: Build admin UI
        working-directory: ./admin-ui
        run: npm ci --legacy-peer-deps && npm run build

      - name: Build JS SDK
        working-directory: ./sdk-js
        run: npm ci && npm run build

  deploy-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    needs: checks
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-api
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Fly.io flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  deploy-admin-ui:
    name: Deploy Admin UI to Fly.io
    runs-on: ubuntu-latest
    needs: checks

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-admin-ui
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./admin-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Fly.io flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
