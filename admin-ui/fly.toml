# fly.toml app configuration file generated for forest-bush-ui on 2025-06-06T12:38:18-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'forest-bush-ui'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    VITE_API_URL = "https://forest-bush.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
